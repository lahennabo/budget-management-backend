# URL de connexion utilisant le r\u00E9seau priv\u00E9 rapide de Railway
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# IMPORTANT : Forcer la cr\u00E9ation des tables au d\u00E9marrage
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Forcer Spring \u00E0 initialiser la base m\u00EAme si la connexion est paresseuse
spring.jpa.defer-datasource-initialization=true

# Port r\u00E9seau dynamique pour le Cloud
server.port=${PORT:8080}
server.address=0.0.0.0
