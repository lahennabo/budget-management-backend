# Configuration de la Base de Donn\u00E9es via l'URL publique de Railway
spring.datasource.url=jdbc:${MYSQL_PUBLIC_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Param\u00E8tres Hibernate / JPA modernes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Assigner le port dynamique de la plateforme
server.port=${PORT:8080}

# FORCER L'\u00C9COUTE SUR TOUTES LES INTERFACES R\u00C9SEAU (Crucial pour Railway)
server.address=0.0.0.0
