name: Java CI with Maven

on:
  push:
    branches: [ "main" ] # Remplacez "main" par le nom de votre branche si nécessaire
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: maven

    - name: Make mvnw executable
      run: chmod +x mvnw

    - name: Build with Maven Wrapper
      run: ./mvnw clean package
