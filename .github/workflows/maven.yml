name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # v4 est entièrement compatible avec les exigences actuelles de GitHub
    - uses: actions/checkout@v4 

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: maven

    - name: Make mvnw executable
      run: chmod +x mvnw

    # Le drapeau -DskipTests empêche Maven d'échouer à cause de la base de données
    - name: Build with Maven Wrapper
      run: ./mvnw clean package -DskipTests
